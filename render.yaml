services:
  - type: web
    name: ganamas-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: SEED_USERNAME
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: LOW_STOCK_THRESHOLD
        value: "5"
      - key: NODE_ENV
        value: production
